<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F4B43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Склад аптеки">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.telegram.org https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<title>Склад аптеки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pine: #1F4B43;
    --pine-deep: #143630;
    --pine-light: #2E6358;
    --sage: #7FA593;
    --sage-tint: #E8F1EC;
    --cream: #F8F9FA;
    --ink: #1E293B;
    --muted: #64748B;
    --line: #E2E8F0;
    --purple-btn: #5A35E0;
    --purple-hover: #4826C7;
    --telegram: #0088CC;
    --telegram-hover: #0077B5;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-soft: 0 2px 10px rgba(0,0,0,0.04);
    --shadow-card: 0 4px 14px rgba(0,0,0,0.06);
    --shadow-lift: 0 10px 28px rgba(23,55,48,.16);
  }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  input, select, button, textarea { font-family: inherit; }
  
  header {
    background: radial-gradient(130% 160% at 12% -20%, var(--pine-light) 0%, var(--pine) 50%, var(--pine-deep) 100%);
    color: #EAF3EF;
    padding: 1.15rem 1.25rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 15;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  header .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  header h1 { font-family: 'PT Sans Narrow', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { margin: 3px 0 0; font-size: 13px; color: #BFDBD0; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 10px;
    width: 38px;
    height: 38px;
    color: #EAF3EF;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s ease, transform .1s ease;
  }
  .icon-btn:active { transform: scale(.93); background: rgba(255,255,255,.26); }
  .tg-header-btn {
    background: #0088CC;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s ease, transform .1s ease;
    box-shadow: 0 2px 8px rgba(0,136,204,0.3);
  }
  .tg-header-btn:hover { background: #0077B5; }
  .tg-header-btn:active { transform: scale(.95); }

  .header-actions { display: flex; gap: 7px; align-items: center; }
  
  .search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 15px;
    margin-top: 1rem;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .chips { display: flex; gap: 8px; margin-top: 11px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #EAF3EF;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .chip.active { background: #fff; color: var(--pine-deep); border-color: transparent; }

  main { padding: 1.25rem 1rem 7rem; max-width: 780px; margin: 0 auto; }
  .group-title { font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 0 4px 10px; text-transform: uppercase; letter-spacing: .03em; }
  .group { margin-bottom: 24px; }

  /* Salomat.tj Inspired Product Cards */
  .med-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-soft);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    cursor: pointer;
  }
  .med-card:hover { box-shadow: var(--shadow-card); border-color: #CBD5E1; }
  .med-card:active { transform: scale(.99); }
  
  .med-img-box {
    width: 105px;
    height: 105px;
    border-radius: 12px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .med-img-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
    transition: transform .2s ease;
  }
  .med-card:hover .med-img-box img { transform: scale(1.05); }
  .med-img-empty { font-size: 40px; display: flex; align-items: center; justify-content: center; }

  .med-info { flex: 1; min-width: 0; }
  .med-name {
    font-size: 16.5px;
    font-weight: 700;
    color: #0F172A;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .med-props {
    font-size: 12.5px;
    color: #64748B;
    margin-bottom: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .med-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge-stock {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: #E8F5E9;
    color: #2E7D32;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge-stock.low { background: #FFF3E0; color: #E65100; }
  .badge-stock.empty { background: #FFEBEE; color: #C62828; }
  .badge-added-by {
    font-size: 11px;
    color: var(--muted);
    background: #F1F5F9;
    padding: 3px 7px;
    border-radius: 6px;
  }

  .med-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .med-price-wrap { text-align: right; }
  .med-price-label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .med-price {
    font-size: 19px;
    font-weight: 800;
    color: #0F172A;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .btn-sell-direct {
    background: var(--purple-btn);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(90, 53, 224, 0.25);
    transition: background .15s ease, transform .1s ease;
    white-space: nowrap;
  }
  .btn-sell-direct:hover { background: var(--purple-hover); }
  .btn-sell-direct:active { transform: scale(.95); }

  @media (max-width: 540px) {
    .med-card { padding: 12px; gap: 12px; }
    .med-img-box { width: 85px; height: 85px; }
    .med-name { font-size: 15px; }
    .med-price { font-size: 17px; }
    .btn-sell-direct { padding: 7px 12px; font-size: 12.5px; }
  }

  .empty-state { text-align: center; margin-top: 3.5rem; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .fabs { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 12px; z-index: 12; }
  .fab {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; transition: transform .1s ease;
  }
  .fab:active { transform: scale(.92); }
  .fab-scan { width: 52px; height: 52px; background: #fff; color: var(--pine); border: 1px solid var(--line); box-shadow: var(--shadow-lift); }
  .fab-add { width: 58px; height: 58px; background: var(--pine); color: #fff; box-shadow: var(--shadow-lift); font-size: 28px; }

  /* Sheets & Modals */
  .overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
    display: flex; align-items: flex-end; justify-content: center; z-index: 25;
    backdrop-filter: blur(3px);
  }
  .sheet {
    background: #fff; width: 100%; max-width: 520px;
    border-radius: 24px 24px 0 0; padding: 1.5rem 1.35rem 2.2rem;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
  }
  .sheet h2 { margin: 0 0 1.1rem; font-family: 'PT Sans Narrow', sans-serif; font-size: 20px; font-weight: 700; color: #0F172A; }
  label.field-label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 5px; font-weight: 600; }
  .field-input {
    width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); font-size: 15px; background: #fff; margin-bottom: 12px;
    transition: border-color .12s ease;
  }
  .field-input:focus { outline: none; border-color: var(--purple-btn); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { padding: 12px; border-radius: var(--radius-sm); font-size: 14.5px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: #fff; flex: 1; text-align: center; transition: transform .1s ease, background .12s ease; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--pine); color: #fff; border: none; }
  .btn-purple { background: var(--purple-btn); color: #fff; border: none; }
  .btn-telegram { background: #0088CC; color: #fff; border: none; }
  .btn-danger { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .error-text { color: #DC2626; font-size: 13px; margin: -4px 0 10px; font-weight: 600; }
  
  .photo-dropzone {
    border: 2px dashed #CBD5E1; border-radius: var(--radius-md); background: #F8FAFC;
    padding: 16px; text-align: center; margin-bottom: 16px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px;
  }
  .photo-dropzone:hover { background: #F1F5F9; border-color: var(--purple-btn); }
  .photo-preview-large {
    width: 140px; height: 140px; object-fit: contain; border-radius: 10px;
    background: #fff; border: 1px solid #E2E8F0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 8px;
  }

  /* Admin Styles */
  .admin-tabs-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .admin-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    margin-bottom: 0;
    scrollbar-width: none;
    scroll-behavior: smooth;
    flex: 1;
    cursor: grab;
    user-select: none;
    -webkit-overflow-scrolling: touch;
  }
  .admin-tabs.dragging { cursor: grabbing; scroll-behavior: auto; }
  .admin-tabs::-webkit-scrollbar { display: none; }
  .admin-tab-scroll {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #fff;
    color: var(--pine);
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-soft);
    transition: transform .1s ease, background .12s ease;
  }
  .admin-tab-scroll:hover { background: var(--sage-tint); }
  .admin-tab-scroll:active { transform: scale(.92); }
  .admin-tab {
    flex-shrink: 0; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
    background: #fff; border: 1px solid var(--line); cursor: pointer; color: var(--muted);
  }
  .admin-tab.active { background: var(--pine); color: #fff; border-color: var(--pine); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.1rem; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; box-shadow: var(--shadow-soft); }
  .stat-label { font-size: 12px; color: var(--muted); margin: 0 0 5px; font-weight: 700; text-transform: uppercase; }
  .stat-value { font-size: 20px; font-weight: 800; margin: 0; font-variant-numeric: tabular-nums; }
  .period-row { display: flex; gap: 6px; margin-bottom: 1.1rem; }
  .period-btn { flex: 1; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .period-btn.active { background: var(--pine); color: #fff; border-color: var(--pine); }
  .table-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 10px; box-shadow: var(--shadow-soft); }
  .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sale-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .sale-row:last-child { border-bottom: none; }
  .sale-row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pw-badge { background: #FFF3E0; border: 1px solid #FFE0B2; color: #E65100; font-family: monospace; font-size: 14px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
  .online-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #27AE60; margin-right: 5px; }

  /* Gate Screen */
  .gate {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; text-align: center;
    background: radial-gradient(120% 90% at 50% 0%, #E8F1EC 0%, var(--cream) 55%);
  }
  .gate-mark {
    width: 68px; height: 68px; border-radius: 20px; background: var(--pine);
    display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
    box-shadow: var(--shadow-lift);
  }
  .gate h1 { font-family: 'PT Sans Narrow', sans-serif; font-size: 28px; font-weight: 700; margin: 0 0 6px; color: var(--pine-deep); }
  .gate p.lede { color: var(--muted); font-size: 14.5px; margin: 0 0 26px; }
  .role-stack { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
  .role-card {
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--line);
    background: #fff; cursor: pointer; box-shadow: var(--shadow-soft);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .role-card:active { transform: scale(.98); }
  .role-card .role-icon {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--sage-tint); color: var(--pine);
  }
  .role-card.primary { border-color: var(--pine); border-width: 1.5px; }
  .role-card.primary .role-icon { background: var(--pine); color: #fff; }
  .role-card .role-title { font-size: 16px; font-weight: 700; margin: 0; }
  .role-card .role-sub { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; }
  .seller-select-btn {
    width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: #fff; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: 600;
  }
  .seller-select-btn.active { border-color: var(--pine); background: var(--sage-tint); color: var(--pine); }
  .toast {
    position: fixed; left: 1rem; right: 1rem; bottom: 6.5rem;
    background: var(--ink); color: #fff; border-radius: var(--radius-md); padding: 13px 16px;
    font-size: 13.5px; z-index: 30; max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow-lift);
  }
  .toast.error { background: #FEE2E2; color: #991B1B; }
  .toast.success { background: var(--pine); }

  /* ===== v3 visual layer ===== */
  body { padding-bottom: 84px; }
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 22px rgba(15,23,42,.09); z-index: 20; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .nav-item { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 6px 2px; border-radius: 14px; cursor: pointer; font-family: inherit; }
  .nav-item.active { color: var(--pine); background: #E6F2EE; }
  .nav-ic { font-size: 21px; line-height: 1; }
  .nav-badge { position: absolute; top: 1px; left: calc(50% + 6px); background: #DC2626; color: #fff; font-size: 10.5px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
  .fabs { bottom: 5.6rem !important; }
  .lang-fab { position: fixed; left: 12px; bottom: 92px; z-index: 19; display: flex; padding: 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-lift); background: #fff; font-size: 11.5px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .lang-fab span { padding: 8px 11px; color: var(--muted); }
  .lang-fab span.on { background: var(--pine); color: #fff; }
  .lang-fab.nonav { bottom: 16px; }
  .banner { display: flex; align-items: center; gap: 14px; border-radius: 20px; padding: 16px 18px; color: #fff; margin: 14px 0; box-shadow: var(--shadow-lift); }
  .banner.red { background: linear-gradient(135deg,#DC2626,#F97316); }
  .banner.orange { background: linear-gradient(135deg,#F59E0B,#EA580C); }
  .banner.green { background: linear-gradient(135deg,#16A34A,#0F766E); }
  .banner-ic { font-size: 34px; }
  .banner-title { font-size: 19px; font-weight: 800; }
  .banner-sub { font-size: 13px; opacity: .92; margin-top: 2px; }
  .task-card { background: #fff; border: 1px solid var(--line); border-left: 6px solid #F59E0B; border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; box-shadow: var(--shadow); }
  .task-card.red { border-left-color: #DC2626; }
  .task-img { width: 58px; height: 58px; border-radius: 14px; background: #F1F5F9; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; flex: 0 0 auto; }
  .task-img img { width: 100%; height: 100%; object-fit: cover; }
  .task-name { font-size: 15px; font-weight: 800; color: var(--ink); }
  .meta-line { font-size: 12.5px; color: var(--muted); }
  .task-btn { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 800; }
  .pill.red { background: #FEE2E2; color: #B91C1C; }
  .pill.orange { background: #FFEDD5; color: #C2410C; }
  .pill.green { background: #DCFCE7; color: #15803D; }
  .days-badge { flex: 0 0 auto; width: 62px; text-align: center; border-radius: 14px; padding: 6px 4px; }
  .days-badge.red { background: #FEE2E2; color: #B91C1C; } .days-badge.orange { background: #FFEDD5; color: #C2410C; }
  .days-num { font-size: 24px; font-weight: 800; line-height: 1.1; } .days-lbl { font-size: 10.5px; font-weight: 700; }
  .sup-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .sup-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .sup-stats div { background: #F8FAFC; border-radius: 12px; padding: 8px; text-align: center; }
  .sup-stats span { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .sup-stats strong { font-size: 13.5px; }
  .med-card { border-left: 6px solid #22C55E; }
  .med-card.low { border-left-color: #F59E0B; }
  .med-card.empty { border-left-color: #DC2626; }

/* ==================== SECURITY HELPERS ==================== */
const HASH_PREFIX = "pbkdf2$";
const toHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
async function derive(secret, salt) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
  return toHex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, key, 256));
}
// Passwords / PINs are stored only as salted PBKDF2 hashes (needs https:// or localhost)
async function hashSecret(secret) {
  secret = String(secret || "");
  if (!(window.crypto && crypto.subtle)) return secret;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return HASH_PREFIX + toHex(salt) + "$" + await derive(secret, salt);
}
async function checkSecret(input, stored) {
  input = String(input || ""); stored = String(stored || "");
  if (!stored) return false;
  if (!stored.startsWith(HASH_PREFIX)) return input === stored; // legacy plaintext, upgraded after login
  if (!(window.crypto && crypto.subtle)) return false;
  const [, saltHex, hashHex] = stored.split("$");
  if (!saltHex || !hashHex) return false;
  const h = await derive(input, new Uint8Array(saltHex.match(/../g).map(x => parseInt(x, 16))));
  let diff = h.length ^ hashHex.length;
  for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ (hashHex.charCodeAt(i) || 0);
  return diff === 0;
}
const isHashed = s => String(s || "").startsWith(HASH_PREFIX);

// Brute-force lockout: 5 wrong tries -> wait grows 30s, 60s, 120s ... (max 15 min)
const LOCK_KEY = "pharmacy_lock_v1";
function lockLeft(k) { const d = load(LOCK_KEY, {})[k]; return d && d.until > Date.now() ? Math.ceil((d.until - Date.now()) / 1000) : 0; }
function lockFail(k) {
  const all = load(LOCK_KEY, {}); const d = all[k] || { n: 0, until: 0, rounds: 0 };
  d.n++;
  if (d.n >= 5) { d.n = 0; d.rounds++; d.until = Date.now() + Math.min(900, 30 * Math.pow(2, d.rounds - 1)) * 1000; }
  all[k] = d; save(LOCK_KEY, all);
}
function lockReset(k) { const all = load(LOCK_KEY, {}); delete all[k]; save(LOCK_KEY, all); }
const lockMsg = k => "Слишком много попыток. Подождите " + lockLeft(k) + " сек.";
const SAFE_ID = /^[\w.-]{1,64}$/;

// Auto-logout of the administrator after 10 minutes of inactivity
let _lastAct = Date.now();
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { _lastAct = Date.now(); }, { passive: true }));

// Separate "revenue" password: income screens open only after entering it (auto-locks after 5 min idle)

function revenueOpen() { return !!state.ui.revUnlocked && Date.now() - _lastAct < 300000; }
setInterval(() => { if (state.ui.revUnlocked && !revenueOpen()) { state.ui.revUnlocked = false; if (state.ui.view === "admin") render(); } }, 15000);

    ${mode !== "unlock" ? inp("revInput2", "Повторите пароль", mode === "create" ? "app.createRevenuePassword()" : "app.resetRevenuePassword()") : ""}
    ${s.revError ? `<p class="error-text">${escapeHtml(s.revError)}</p>` : ""}
    <div class="btn-row">
      <button class="btn btn-primary" onclick="app.${mode === "unlock" ? "unlockRevenue" : mode === "create" ? "createRevenuePassword" : "resetRevenuePassword"}()">${mode === "unlock" ? "Открыть" : mode === "create" ? "Создать" : "Сбросить"}</button>

  </div>`;
}

// ---- One-time migration from the old single-store data format ----
// If this browser has old v2 data but no v3 data yet, convert it: the single
// old "qty" per medicine becomes that medicine's stock at the default store.
(function migrateToMultiStore() {
  if (localStorage.getItem(KEYS.meds)) return; // already migrated / already on v3
  const oldMeds = load(OLD_KEYS.meds, null);
  if (!oldMeds) return; // nothing to migrate, fresh install
  const oldSellers = load(OLD_KEYS.sellers, []) || [];
  const storeId = DEFAULT_STORES[0].id;

  const migratedMeds = oldMeds.map(m => {
    const copy = Object.assign({}, m);
    copy.stock = { [storeId]: m.qty || 0 };
    delete copy.qty;
    return copy;
  });
  const migratedSellers = oldSellers.map(s => Object.assign({ storeId }, s));
  const oldSales = load(OLD_KEYS.sales, []) || [];
  const migratedSales = oldSales.map(s => Object.assign({ storeId }, s));
  const oldLogs = load(OLD_KEYS.logs, []) || [];
  const migratedLogs = oldLogs.map(l => Object.assign({ storeId }, l));

  save(KEYS.stores, DEFAULT_STORES);
  save(KEYS.meds, migratedMeds);
  save(KEYS.sellers, migratedSellers);
  save(KEYS.sales, migratedSales);
  save(KEYS.logs, migratedLogs);
  const oldSettings = load(OLD_KEYS.settings, null);
  if (oldSettings) save(KEYS.settings, oldSettings);
  const oldPriceReqs = load(OLD_KEYS.priceRequests, null);
  if (oldPriceReqs) save(KEYS.priceRequests, oldPriceReqs);
})();

let initialStores = load(KEYS.stores, null);
if (!initialStores || initialStores.length === 0) {
  initialStores = DEFAULT_STORES;
  save(KEYS.stores, initialStores);
}

let initialSellers = load(KEYS.sellers, null);
if (!initialSellers || initialSellers.length === 0) {
  initialSellers = DEFAULT_SELLERS;
  save(KEYS.sellers, initialSellers);
}
// Safety net: any seller without a store gets assigned to the first store
initialSellers.forEach(s => { if (!s.storeId) s.storeId = initialStores[0].id; });

let initialMeds = load(KEYS.meds, null);
if (!initialMeds || initialMeds.length === 0) {

  save(KEYS.meds, initialMeds);
}
// Safety net: any medicine without a stock map gets one (empty)
initialMeds.forEach(m => { if (!m.stock || typeof m.stock !== "object") m.stock = {}; });

let state = {

function persist() {

/* ==================== MULTI-STORE (CHAIN) HELPERS ====================
   Medicines share one catalog (name, manufacturer, price, photo, category)
   across the whole chain, but each pharmacy point keeps its own stock count
   and its own sales. m.stock is a { storeId: qty } map. */
function storeName(id) {
  const s = state.stores.find(x => x.id === id);
  return s ? s.name : "—";
}
// The pharmacy point whose inventory/sales the current person is looking at.
// A seller is always locked to their own store; an admin can switch stores.
function activeStoreId() {
  if (!isAdmin() && state.ui.currentSeller) return state.ui.currentSeller.storeId || (state.stores[0] && state.stores[0].id);
  return state.ui.currentStoreId || (state.stores[0] && state.stores[0].id);
}
function stockOf(m, storeId) {
  storeId = storeId || activeStoreId();
  return (m.stock && m.stock[storeId]) || 0;
}
function setStockOf(m, storeId, val) {
  storeId = storeId || activeStoreId();
  if (!m.stock) m.stock = {};
  m.stock[storeId] = Math.max(0, val);
}
function addStockOf(m, storeId, delta) {
  setStockOf(m, storeId, stockOf(m, storeId) + delta);
}
function totalStockAllStores(m) {
  return state.stores.reduce((sum, st) => sum + stockOf(m, st.id), 0);
}


/* ==================== CART / ONE RECEIPT ==================== */
function cartLines() {
  const sid = activeStoreId();

    if (!m) return null;
    return { m, qty: c.qty, price: m.price, sum: m.price * c.qty, avail: stockOf(m, sid) };
  }).filter(Boolean);
}
function cartTotal() { return cartLines().reduce((t, l) => t + l.sum, 0); }
function cartCount() { return state.ui.cart.length; }
function cartQtyOf(medId) { const c = state.ui.cart.find(x => x.medId === medId); return c ? c.qty : 0; }
function receiptGroups(list) {
  const map = new Map();
  list.forEach(x => {
    const k = x.receiptId || x.id;
    if (!map.has(k)) map.set(k, { key: k, items: [], total: 0, timestamp: x.timestamp, sellerName: x.sellerName, storeId: x.storeId });
    const g = map.get(k); g.items.push(x); g.total += x.total;
  });
  return Array.from(map.values());
}

}

  const lines = cartLines();

  return `

function getCurrency() { return state.settings.currency || "с."; }
function fmtPrice(n) {
  const num = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n || 0);
  return num + " " + getCurrency();
}
function fmtDate(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleString("ru-RU", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function escapeHtml(s) { return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isAdmin() { return !!state.ui.adminLoggedIn; }
function getCurrentUserName() {
  if (isAdmin()) return "Администратор";
  if (state.ui.currentSeller) return state.ui.currentSeller.name;
  return "Продавец";
}
function pendingPriceRequestFor(medId) { return state.priceRequests.find(r => r.medicineId === medId); }

function allCategories() {
  const set = new Set([...DEFAULT_CATEGORIES, ...(state.settings.customCategories || [])]);
  state.meds.forEach(m => m.category && set.add(m.category));
  return Array.from(set);
}
function categoriesInUse() {
  const set = new Set(state.meds.map(m => m.category || "Другое"));
  return allCategories().filter(c => set.has(c));
}
function filteredMeds() {
  let list = state.meds;
  if (state.ui.activeCategory !== "Все") list = list.filter(m => (m.category||"Другое") === state.ui.activeCategory);
  if (state.ui.query.trim()) {
    const q = state.ui.query.trim().toLowerCase();
    list = list.filter(m =>
      (m.name && m.name.toLowerCase().includes(q)) ||
      (m.manufacturer && m.manufacturer.toLowerCase().includes(q)) ||
      (m.country && m.country.toLowerCase().includes(q))
    );
  }
  list = [...list];
  const sid = activeStoreId();
  if (state.settings.sortLowFirst) list.sort((a,b) => stockOf(a,sid) - stockOf(b,sid));
  else list.sort((a,b) => (a.name||"").localeCompare(b.name||"", "ru"));
  return list;
}
function groupedMeds() {
  const list = filteredMeds();
  if (state.ui.activeCategory !== "Все") return [[state.ui.activeCategory, list]];
  const map = new Map();
  list.forEach(m => {
    const c = m.category || "Другое";
    if (!map.has(c)) map.set(c, []);
    map.get(c).push(m);
  });
  return Array.from(map.entries());
}

function periodStart(period) {
  const now = new Date();
  if (period === "today") { const d = new Date(now); d.setHours(0,0,0,0); return d.getTime(); }
  if (period === "week") return now.getTime() - 7*24*3600*1000;
  if (period === "month") return now.getTime() - 30*24*3600*1000;
  return 0;
}
function salesInPeriod(period, sellerFilter = "all", storeFilter = "all") {
  const start = periodStart(period);
  return state.sales.filter(s => {
    const inTime = s.timestamp >= start;
    if (!inTime) return false;
    if (storeFilter !== "all" && s.storeId !== storeFilter) return false;
    if (sellerFilter === "all") return true;
    return s.sellerId === sellerFilter || s.sellerName === sellerFilter;
  });
}
function totalRevenue(period, sellerFilter = "all", storeFilter = "all") {
  return salesInPeriod(period, sellerFilter, storeFilter).reduce((sum,s) => sum + s.total, 0);
}
function totalUnitsSold(period, sellerFilter = "all", storeFilter = "all") {
  return salesInPeriod(period, sellerFilter, storeFilter).reduce((sum,s) => sum + s.qty, 0);
}
// storeFilter: a specific store id, or "all" to sum inventory value across the whole chain
function inventoryValue(storeFilter = "all") {
  return state.meds.reduce((sum,m) => {
    const q = storeFilter === "all" ? totalStockAllStores(m) : stockOf(m, storeFilter);
    return sum + q * (m.price || 0);
  }, 0);
}
function lowStockCount(storeFilter = "all") {
  return state.meds.filter(m => {
    const q = storeFilter === "all" ? totalStockAllStores(m) : stockOf(m, storeFilter);
    return q <= state.settings.threshold;
  }).length;
}
function topSelling(period, sellerFilter = "all", storeFilter = "all") {
  const map = new Map();
  salesInPeriod(period, sellerFilter, storeFilter).forEach(s => {
    map.set(s.name, (map.get(s.name)||0) + s.qty);
  });
  return Array.from(map.entries()).sort((a,b) => b[1]-a[1]).slice(0,5);
}

/* ==================== AI MEDICINE SCANNER ENGINE ==================== */
// Recognizes brand name, manufacturer and country from a photo of a medicine box.
// Uses the Anthropic Claude API directly from the browser with the user's own API key
// (entered in Settings). Price and quantity are always left for the person to fill in.
async function recognizeMedicineFromPhoto(dataUrl) {
  const apiKey = (state.settings.apiKey || "").trim();
  if (!apiKey) {
    return { ok: false, error: "no_key" };
  }

  const match = /^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/.exec(dataUrl || "");
  if (!match) {
    return { ok: false, error: "bad_image" };
  }
  const mediaType = match[1];
  const base64Data = match[2];

  const prompt = `Посмотри на фото упаковки лекарства. Определи:
- name: точное коммерческое название лекарства (как написано на упаковке, с дозировкой если есть)
- manufacturer: название фирмы-производителя
- country: страна производства

Если что-то не удаётся прочитать на фото — оставь пустую строку "" для этого поля, не придумывай.
Ответь СТРОГО в формате JSON без каких-либо пояснений, markdown или текста до/после:
{"name": "...", "manufacturer": "...", "country": "..."}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });

    const data = await res.json();

    if (!res.ok) {
      const msg = (data && data.error && data.error.message) ? data.error.message : ("HTTP " + res.status);
      return { ok: false, error: "api_error", message: msg };
    }

    const textBlock = (data.content || []).find(b => b.type === "text");
    if (!textBlock) return { ok: false, error: "empty_response" };

    let jsonText = textBlock.text.trim();
    // Strip accidental markdown code fences just in case
    jsonText = jsonText.replace(/^```json\s*/i, "").replace(/^```\s*/, "").replace(/```\s*$/, "").trim();

    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch (e) {
      return { ok: false, error: "parse_error" };
    }

    return {
      ok: true,
      name: (parsed.name || "").trim(),
      manufacturer: (parsed.manufacturer || "").trim(),
      country: (parsed.country || "").trim()
    };
  } catch (e) {
    console.warn("Recognition API error:", e);
    return { ok: false, error: "network_error", message: e && e.message ? e.message : String(e) };
  }
}

/* ==================== TELEGRAM BOT API ENGINE ==================== */
async function tgCall(method, body) {
  const token = (state.settings.telegramBotToken || "").trim();
  if (!token) return { ok: false, description: "Не указан Bot Token" };
  if (!/^\d{5,}:[A-Za-z0-9_-]{20,}$/.test(token)) return { ok: false, description: "Неверный формат Bot Token" };
  try {
    const res = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch(e) {
    console.warn("Telegram API error:", e);
    return { ok: false, description: "network_error: " + (e && e.message ? e.message : e) };
  }
}

async function tgSendMessage(text, inlineKeyboard = null) {
  const chatId = (state.settings.telegramChatId || "").trim();
  if (!chatId) return { ok: false, description: "Не указан Chat ID" };
  const payload = {
    chat_id: chatId,
    text: text,
    parse_mode: "HTML"
  };
  if (inlineKeyboard) {
    payload.reply_markup = { inline_keyboard: inlineKeyboard };
  }
  return await tgCall("sendMessage", payload);
}

// Background poller for telegram button clicks and commands
async function pollTelegram() {
  const token = (state.settings.telegramBotToken || "").trim();
  const chatId = (state.settings.telegramChatId || "").trim();
  if (!token || !chatId) return;

  try {
    const offset = (state.settings.telegramLastUpdateId || 0) + 1;
    const res = await tgCall("getUpdates", { offset: offset, timeout: 5, limit: 10 });
    if (res && res.ok && Array.isArray(res.result) && res.result.length > 0) {
      for (const update of res.result) {
        state.settings.telegramLastUpdateId = Math.max(state.settings.telegramLastUpdateId || 0, update.update_id);

        // Ignore anyone except the administrator's own chat (blocks strangers who find the bot)
        const fromChat = String(
          (update.callback_query && update.callback_query.message && update.callback_query.message.chat && update.callback_query.message.chat.id) ||
          (update.message && update.message.chat && update.message.chat.id) || "");
        if (fromChat !== chatId) continue;

        // 1. Handle Callback Query (Button Clicks on Phone)
        if (update.callback_query) {
          const cb = update.callback_query;
          const data = cb.data || "";
          
          if (data.startsWith("appr_med_")) {
            const medId = data.replace("appr_med_", "");
            const med = state.meds.find(x => x.id === medId);
            if (med) {
              med.priceUnconfirmed = false;
              persist();
              render();
              await tgSendMessage(`✅ <b>Одобрено с телефона!</b>\nЛекарство <b>«${escapeHtml(med.name)}»</b> по цене ${fmtPrice(med.price)} подтверждено на кассе.`);
            }
          } else if (data.startsWith("rej_med_")) {
            const medId = data.replace("rej_med_", "");
            const med = state.meds.find(x => x.id === medId);
            state.meds = state.meds.filter(x => x.id !== medId);
            persist();
            render();
            await tgSendMessage(`❌ <b>Отклонено с телефона!</b>\nЛекарство <b>«${escapeHtml(med ? med.name : "")}»</b> удалено со склада.`);
          } else if (data.startsWith("appr_pr_")) {
            const reqId = data.replace("appr_pr_", "");
            const r = state.priceRequests.find(x => x.id === reqId);
            if (r) {
              const med = state.meds.find(x => x.id === r.medicineId);
              if (med) med.price = r.newPrice;
              state.priceRequests = state.priceRequests.filter(x => x.id !== reqId);
              persist();
              render();
              await tgSendMessage(`✅ <b>Новая цена одобрена!</b>\n${escapeHtml(r.name)}: новая цена ${fmtPrice(r.newPrice)}.`);
            }
          } else if (data.startsWith("rej_pr_")) {
            const reqId = data.replace("rej_pr_", "");
            const r = state.priceRequests.find(x => x.id === reqId);
            if (r) {
              state.priceRequests = state.priceRequests.filter(x => x.id !== reqId);
              persist();
              render();
              await tgSendMessage(`❌ <b>Изменение цены отклонено!</b>\n${escapeHtml(r.name)}: цена остаётся ${fmtPrice(r.oldPrice)}.`);
            }
          }
        }

        // 2. Handle Text Commands from Administrator (/stats, /today, etc.)
        if (update.message && update.message.text) {
          const text = update.message.text.trim().toLowerCase();
          if (text === "/stats" || text === "/today" || text.includes("выручк") || text.includes("отчет")) {
            const rev = totalRevenue("today");
            const sold = totalUnitsSold("today");
            const count = receiptGroups(salesInPeriod("today")).length;
            
            let sellerLines = "";
            state.sellers.forEach(s => {
              const sum = totalRevenue("today", s.id);
              const units = totalUnitsSold("today", s.id);
              if (units > 0) {
                sellerLines += `\n• <b>${escapeHtml(s.name)}:</b> ${fmtPrice(sum)} (${units} шт.)`;
              }
            });

            const reply = `📊 <b>Отчет аптеки за сегодня:</b>\n` +
              `💰 <b>Общая выручка:</b> ${fmtPrice(rev)}\n` +
              `📦 <b>Продано упаковок:</b> ${sold} шт.\n` +
              `🧾 <b>Всего чеков:</b> ${count} шт.\n` +
              (sellerLines ? `\n👥 <b>По сотрудникам:</b>${sellerLines}` : "");
            
            await tgSendMessage(reply);
          } else if (text === "/low" || text.includes("мало") || text.includes("остатк")) {
            const lowLines = [];
            state.meds.forEach(m => {
              state.stores.forEach(st => {
                const q = stockOf(m, st.id);
                if (q <= state.settings.threshold) {
                  lowLines.push(`• <b>${escapeHtml(m.name)}</b> (${escapeHtml(st.name)}): осталось ${q} ${escapeHtml(m.unit)}`);
                }
              });
            });
            if (lowLines.length === 0) {
              await tgSendMessage("✅ Все лекарства в достаточном количестве!");
            } else {
              await tgSendMessage(`⚠️ <b>Мало на складе:</b>\n${lowLines.slice(0, 15).join("\n")}`);
            }
          } else if (text === "/start" || text === "/help") {
            await tgSendMessage(
              `👋 <b>Здравствуйте, Администратор!</b>\n\n` +
              `Бот подключен к вашей аптеке.\n` +
              `Команды с телефона:\n` +
              `• /stats — выручка за сегодня и продажи по продавцам\n` +
              `• /low — список лекарств с малым остатком\n\n` +
              `<i>Когда продавцы будут добавлять новые лекарства, вам сразу будут приходить кнопки для одобрения прямо сюда!</i>`
            );
          }
        }
      }
      persist();
    }
  } catch(e) {}
}

function daysLeft(m) {
  if (!m.expiry) return null;
  const d = new Date(m.expiry + "T00:00:00");
  if (isNaN(d)) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function expiringMeds() {
  return state.meds.filter(m => { const d = daysLeft(m); return d !== null && d <= 30 && stockOf(m) > 0; })
    .sort((a,b) => daysLeft(a) - daysLeft(b));
}
function reorderMeds() {
  const sid = activeStoreId();
  return state.meds.filter(m => stockOf(m, sid) <= state.settings.threshold)
    .sort((a,b) => stockOf(a, sid) - stockOf(b, sid));
}

/* ==================== CALCULATOR ==================== */
function calcEval(expr) {
  const s = String(expr).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".").replace(/\s+/g,"");
  let i = 0, lastPct = false, termPct = false;
  const peek = () => s[i];
  const fail = () => { throw new Error("bad"); };
  function num() { const st = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; if (st === i) fail(); const v = parseFloat(s.slice(st, i)); if (isNaN(v)) fail(); return v; }
  function factor() {
    lastPct = false;
    if (peek() === "-") { i++; return -factor(); }
    let v;
    if (peek() === "(") { i++; v = addSub(); if (peek() !== ")") fail(); i++; lastPct = false; }
    else v = num();
    while (peek() === "%") { i++; v = v / 100; lastPct = true; }
    return v;
  }
  function term() {
    let v = factor(), only = lastPct;
    while (peek() === "*" || peek() === "/") {
      only = false;
      const o = s[i++], r = factor();
      if (o === "*") v *= r; else { if (r === 0) fail(); v /= r; }
    }
    termPct = only;
    return v;
  }
  function addSub() {
    let v = term();
    while (peek() === "+" || peek() === "-") {
      const o = s[i++], r = term(), rr = termPct ? v * r : r; // 200 + 10% = 220
      v = o === "+" ? v + rr : v - rr;
    }
    return v;
  }
  const v = addSub();
  if (i !== s.length) fail();
  return v;
}
function calcFmt(v) {
  if (!isFinite(v)) return "";
  return String(Math.round(v * 1e6) / 1e6).replace(".", ",");
}
function calcPreview(expr) {
  if (!expr) return "";
  let e = expr.replace(/[+\-×÷−(,]+$/, "");
  const open = (e.match(/\(/g) || []).length - (e.match(/\)/g) || []).length;
  if (open > 0) e += ")".repeat(open);
  try { return calcFmt(calcEval(e)); } catch (err) { return ""; }
}
function numOf(v) { const n = parseFloat(String(v || "").replace(",", ".")); return isNaN(n) ? 0 : n; }
function chgOutHtml() {
  const c = state.ui.calc, total = numOf(c.total), given = numOf(c.given), diff = given - total;
  if (!total && !given) return `<div class="chg-hint">Введите сумму и сколько дал покупатель</div>`;
  if (diff < 0) return `<div class="chg-box bad"><span>Не хватает</span><strong>${fmtPrice(-diff)}</strong></div>`;
  return `<div class="chg-box ok"><span>Сдача покупателю</span><strong>${fmtPrice(diff)}</strong></div>`;
}
function mkOutHtml() {
  const c = state.ui.calc, cost = numOf(c.cost), pct = numOf(c.pct), qty = numOf(c.qty) || 1;
  if (!cost) return `<div class="chg-hint">Введите цену закупки и наценку</div>`;
  const price = cost * (1 + pct / 100), profit = price - cost;
  return `<div class="chg-box ok"><span>Цена продажи</span><strong>${fmtPrice(Math.round(price * 100) / 100)}</strong></div>
    <div class="mk-row"><span>Прибыль с 1 шт.</span><strong>${fmtPrice(Math.round(profit * 100) / 100)}</strong></div>
    ${qty > 1 ? `<div class="mk-row"><span>Прибыль с ${qty} шт.</span><strong>${fmtPrice(Math.round(profit * qty * 100) / 100)}</strong></div>
    <div class="mk-row"><span>Закупка на ${qty} шт.</span><strong>${fmtPrice(Math.round(cost * qty * 100) / 100)}</strong></div>` : ""}`;
}
function renderCalcModal() {
  const c = state.ui.calc, mode = c.mode;
  const tabs = [["calc","🧮","Калькулятор"],["change","💵","Сдача"],["markup","📈","Наценка"]];
  let body = "";
  if (mode === "calc") {
    const keys = [["C","fn"],["(","fn"],[")","fn"],["÷","op"],["7"],["8"],["9"],["×","op"],["4"],["5"],["6"],["−","op"],["1"],["2"],["3"],["+","op"],["0"],[","],["⌫","fn"],["=","eq"]];
    const prev = calcPreview(c.expr);
    body = `
      <div class="calc-screen">
        <div class="calc-expr">${escapeHtml(c.expr) || "0"}</div>
        <div class="calc-res">${prev && prev !== c.expr ? "= " + escapeHtml(prev) : "&nbsp;"}</div>
      </div>
      <div class="calc-grid">
        ${keys.map(([k, t]) => `<button class="ck ${t||""}" onclick="app.calcKey('${k}')">${k}</button>`).join("")}
        <button class="ck fn" onclick="app.calcKey('%')" style="grid-column: span 2;">%</button>
        <button class="ck fn" onclick="app.calcToChange()" style="grid-column: span 2;font-size:13px;">→ в «Сдачу»</button>
      </div>`;
  } else if (mode === "change") {
    body = `
      <label class="field-label">Сумма к оплате (${getCurrency()})</label>

      <div class="quick-row">${[5,10,20,50,100,200,500].map(v => `<button class="quick-btn" onclick="app.calcQuick(${v})">${v}</button>`).join("")}</div>
      <div id="calcOut">${chgOutHtml()}</div>`;
  } else {
    body = `
      <div class="row">
        <div><label class="field-label">Цена закупки (${getCurrency()})</label><input class="field-input" inputmode="decimal" placeholder="0" value="${escapeHtml(c.cost)}" oninput="app.calcField('cost', this.value)"></div>
        <div><label class="field-label">Наценка, %</label><input class="field-input" inputmode="decimal" placeholder="30" value="${escapeHtml(c.pct)}" oninput="app.calcField('pct', this.value)"></div>

      <div id="calcOut">${mkOutHtml()}</div>`;
  }
  return `
  <div class="overlay" onclick="app.closeCalc()">
    <div class="sheet calc-sheet" onclick="event.stopPropagation()">
      <div class="calc-tabs">${tabs.map(([k, ic, l]) => `<button class="calc-tab ${mode===k?'active':''}" onclick="app.setCalcMode('${k}')">${ic} ${l}</button>`).join("")}</div>
      ${body}
      <button class="btn" style="width:100%;margin-top:12px;" onclick="app.closeCalc()">Закрыть</button>
    </div>
  </div>`;
}

let _tgRules = null;
function buildTgRules() {
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  _tgRules = Object.keys(TG).sort((a,b) => b.length - a.length)
    .map(k => [new RegExp("(?<![\\p{L}\\p{N}])" + esc(k) + "(?![\\p{L}\\p{N}])", "gu"), TG[k]]);
}
function trStr(s) {
  if (!s || state.settings.lang !== "tg" || !/[А-Яа-яЁё]/.test(s)) return s;
  if (!_tgRules) buildTgRules();
  for (const [re, to] of _tgRules) { re.lastIndex = 0; s = s.replace(re, to); }
  return s;
}
function applyLang() {
  document.documentElement.lang = state.settings.lang === "tg" ? "tg" : "ru";
  if (state.settings.lang !== "tg") return;
  const root = document.getElementById("app");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => { const v = n.nodeValue; if (/[А-Яа-яЁё]/.test(v)) { const r = trStr(v); if (r !== v) n.nodeValue = r; } });
  root.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el => {
    ["placeholder","title","aria-label"].forEach(a => { const v = el.getAttribute(a); if (v) { const r = trStr(v); if (r !== v) el.setAttribute(a, r); } });
  });
}
function renderLangBtn(withNav) {
  const tg = state.settings.lang === "tg";
  return `<button class="lang-fab ${withNav ? "" : "nonav"}" onclick="app.toggleLang()" aria-label="Language"><span class="${!tg?"on":""}">РУС</span><span class="${tg?"on":""}">ТОҶ</span></button>`;
}
(function patchDialogs() {
  const a = window.alert.bind(window), c = window.confirm.bind(window);
  window.alert = m => a(trStr(String(m)));
  window.confirm = m => c(trStr(String(m)));
})();

function renderList() {
  const groups = groupedMeds();
  const totalShown = groups.reduce((s,[,items]) => s+items.length, 0);
  let body;
  if (state.meds.length === 0) {
    body = `<div class="empty-state">В аптеке пока нет лекарств.<br>Нажмите <strong>+</strong> снизу, чтобы добавить первое лекарство с фото!</div>`;
  } else if (totalShown === 0) {
    body = `<div class="empty-state">По запросу «${escapeHtml(state.ui.query)}» ничего не найдено.</div>`;
  } else {
    body = groups.map(([cat, items]) => `
      <div class="group">
        ${state.ui.activeCategory==="Все" ? `<div class="group-title">${escapeHtml(cat)} (${items.length})</div>` : ""}
        ${items.map(m => {
          const qHere = stockOf(m);
          const low = qHere <= state.settings.threshold;
          const empty = qHere <= 0;
          const pendingReq = pendingPriceRequestFor(m.id);
          const pendingNote = m.priceUnconfirmed
            ? `<span style="color:#C77D2E;font-weight:700;font-size:11px;">⏳ Цена ожидает одобрения</span>`
            : (pendingReq ? `<span style="color:#C77D2E;font-weight:700;font-size:11px;">⏳ Изменение цены на проверке</span>` : "");

          const dl = daysLeft(m);
          const expNote = (dl !== null && dl <= 30 && qHere > 0) ? `<span class="pill ${dl<0?'red':'orange'}">⏰ ${dl<0 ? "Просрочено" : "Осталось " + dl + " дн."}</span>` : "";
          return `
          <div class="med-card ${empty?'empty':(low?'low':'')}" onclick="app.openItem('${m.id}')">
            <!-- Large Product Image -->
            <div class="med-img-box">
              ${m.photo 
                ? `<img src="${m.photo}" alt="${escapeHtml(m.name)}">`
                : `<div class="med-img-empty">💊</div>`
              }
            </div>

            <!-- Product Details -->
            <div class="med-info">
              <div class="med-name">${escapeHtml(m.name)}</div>
              <div class="med-props">
                ${m.manufacturer ? `<div>Производитель: <strong>${escapeHtml(m.manufacturer)}</strong></div>` : ""}
                ${m.country ? `<div>Страна: <strong>${escapeHtml(m.country)}</strong></div>` : ""}
              </div>
              <div class="med-badges">
                <span class="badge-stock ${empty ? 'empty' : (low ? 'low' : '')}">
                  ${empty ? "Нет в наличии" : (low ? `Мало: ${qHere} ${escapeHtml(m.unit)}` : `В наличии: ${qHere} ${escapeHtml(m.unit)}`)}
                </span>
                ${m.addedBy ? `<span class="badge-added-by">доб: ${escapeHtml(m.addedBy)}</span>` : ""}
                ${pendingNote} ${expNote}
              </div>
            </div>

            <!-- Price & Fast Sell Button -->
            <div class="med-right" onclick="event.stopPropagation()">
              <div class="med-price-wrap">
                <div class="med-price-label">Цена</div>
                <div class="med-price">${fmtPrice(m.price)}</div>
              </div>
              <button class="btn-sell-direct" onclick="app.openFastSell('${m.id}')" ${empty ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                Продать
              </button>
              <button class="btn-cart ${cartQtyOf(m.id) ? 'in' : ''}" onclick="app.addToCart('${m.id}')" ${empty ? 'disabled' : ''}>
                ${cartQtyOf(m.id) ? '✓ В чеке: ' + cartQtyOf(m.id) : '🛒 В чек'}
              </button>
            </div>
          </div>`;
        }).join("")}
      </div>`).join("");
  }
  return `<main>${body}</main>`;
}

function renderFabs() {
  return `
  <div class="fabs">
    <button class="fab fab-scan" onclick="app.startScan()" aria-label="Распознать по фото" ${state.ui.scanning?"disabled":""}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
      </svg>

}

function renderAdminSellers() {

  state.sessions.forEach(s => {
    if (!lastSessionMap.has(s.sellerId) || s.timestamp > lastSessionMap.get(s.sellerId)) {
      lastSessionMap.set(s.sellerId, s.timestamp);
    }
  });

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="group-title" style="margin:0;">Сотрудники и их пароли</div>

    ${state.sellers.map(s => {
      const isCurrent = s.id === currentOnlineSellerId;
      const lastLogin = lastSessionMap.get(s.id);

      return `
      <div class="table-card">
        <div class="table-header">

            <span style="font-size:16px;font-weight:700;">${escapeHtml(s.name)}</span>

        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
          ${state.stores.length>1 ? `🏪 <strong>${escapeHtml(storeName(s.storeId))}</strong> · ` : ""}${lastLogin ? "Последний вход: " + fmtDate(lastLogin) : "Ещё не входил"} · Продано на: <strong>${fmtPrice(sum)}</strong> (${sellerSales.length} продаж)

function renderAdminSalesBySeller(p, periods, sellerF) {
  const sf = state.ui.adminStoreFilter;
  const sellersShown = sf === "all" ? state.sellers : state.sellers.filter(s => s.storeId === sf);
  const sales = salesInPeriod(p, sellerF, sf).slice().sort((a,b) => b.timestamp - a.timestamp);
  const totalRev = totalRevenue(p, sellerF, sf);
  const totalUnits = totalUnitsSold(p, sellerF, sf);

  const medSummary = new Map();
  sales.forEach(s => {
    if (!medSummary.has(s.name)) medSummary.set(s.name, { qty: 0, sum: 0 });
    const cur = medSummary.get(s.name);
    cur.qty += s.qty;
    cur.sum += s.total;
  });
  const sortedMeds = Array.from(medSummary.entries()).sort((a,b) => b[1].sum - a[1].sum);

  return `
    <div class="period-row">
      ${periods.map(([key,label]) => `<button class="period-btn ${p===key?'active':''}" onclick="app.setAdminPeriod('${key}')">${label}</button>`).join("")}
    </div>

    <label class="field-label">Выберите продавца для анализа:</label>
    <div class="chips" style="margin-top:0;margin-bottom:14px;">
      <button class="chip ${sellerF==='all'?'active':''}" style="background:${sellerF==='all'?'var(--pine)':'#fff'};color:${sellerF==='all'?'#fff':'var(--ink)'};border:1px solid var(--line);" onclick="app.setAdminSellerFilter('all')">Все продавцы</button>
      ${sellersShown.map(s => `
        <button class="chip ${sellerF===s.id?'active':''}" style="background:${sellerF===s.id?'var(--pine)':'#fff'};color:${sellerF===s.id?'#fff':'var(--ink)'};border:1px solid var(--line);" onclick="app.setAdminSellerFilter('${s.id}')">${escapeHtml(s.name)}</button>
      `).join("")}
    </div>

    <div class="stat-grid">
      <div class="stat-card"><p class="stat-label">Выручка продавца</p><p class="stat-value">${fmtPrice(totalRev)}</p></div>
      <div class="stat-card"><p class="stat-label">Продано товаров</p><p class="stat-value">${totalUnits} шт.</p></div>
    </div>

    <div class="group-title">Какие лекарства продал сотрудник</div>
    <div class="table-card">
      ${sortedMeds.length === 0 ? `<div class="empty-state" style="margin:1rem 0;">Нет продаж за выбранный период.</div>` :
        sortedMeds.map(([name, data]) => `
          <div class="sale-row">
            <div><strong>${escapeHtml(name)}</strong></div>
            <div style="text-align:right;">
              <div><strong>${fmtPrice(data.sum)}</strong></div>
              <div class="meta">${data.qty} шт.</div>
            </div>
          </div>
        `).join("")}
    </div>

    <div class="group-title" style="margin-top:16px;">Список проданных чеков</div>
    <div class="table-card">
      ${sales.length === 0 ? `<div class="empty-state" style="margin:1rem 0;">Чеков пока нет.</div>` :
        receiptGroups(sales).slice(0, 30).map(g => `
          <div class="rc-group">
            <div class="sale-row" style="border-bottom:none;padding:0 0 4px;">
              <div class="meta">${fmtDate(g.timestamp)} · Продавец: <strong>${escapeHtml(g.sellerName || "—")}</strong>${sf==='all' && state.stores.length>1 ? " · " + escapeHtml(storeName(g.storeId)) : ""}</div>
              <div><strong>${fmtPrice(g.total)}</strong></div>
            </div>
            ${g.items.map(it => `<div class="rc-line"><span>${escapeHtml(it.name)} <span class="meta">${fmtPrice(it.price)} × ${it.qty}</span></span><span>${fmtPrice(it.total)}</span></div>`).join("")}
          </div>
        `).join("")}
    </div>
  `;
}

function renderModals() {
  let html = "";
  if (state.ui.scanning || state.ui.scanError || state.ui.toastSuccess) {
    if (state.ui.scanning) html += `<div class="toast">⟳ Распознаём лекарство по фото...</div>`;
    else if (state.ui.scanError) html += `<div class="toast error">${escapeHtml(state.ui.scanError)} <button style="background:none;border:none;color:#991B1B;margin-left:auto;font-weight:700;" onclick="app.clearToast()">✕</button></div>`;
    else if (state.ui.toastSuccess) html += `<div class="toast success">${escapeHtml(state.ui.toastSuccess)}</div>`;
  }

  if (state.ui.showSellerLogin) html += renderSellerLoginModal();
  if (state.ui.showAdminLogin) html += renderAdminLoginModal();
  if (state.ui.showAdminReset) html += renderAdminResetModal();
  if (state.ui.sup) html += renderSupModal();
  if (state.ui.showCalc) html += renderCalcModal();
  if (state.ui.showSellerForm) html += renderSellerFormModal();
  if (state.ui.showStoreForm) html += renderStoreFormModal();
  if (state.ui.showSellSheet) html += renderFastSellModal();
  if (state.ui.showCart) html += renderCartModal();
  if (state.ui.receipt) html += renderReceiptModal();
  if (state.ui.showForm) html += renderFormSheet();
  if (state.ui.showTelegramModal) html += renderTelegramModal();
  if (state.ui.showSettings) html += renderSettingsSheet();

  return html;
}

/* ==================== APP CONTROLLER ==================== */
const app = {
  setQuery(v) {
    state.ui.query = v;
    const w = document.getElementById("listWrap");
    if (w) { w.innerHTML = renderList(); applyLang(); } else render();
  },
  setCategory(c) { state.ui.activeCategory = c; render(); },
  setCurrency(v) { state.settings.currency = v; persist(); render(); },
  setTelegramSetting(k, v) { state.settings[k] = v; persist(); },
  setApiKey(v) { state.settings.apiKey = v; persist(); },

  openTelegramModal() { state.ui.showTelegramModal = true; render(); },
  closeTelegramModal() { state.ui.showTelegramModal = false; render(); },

  async testTelegram() {
    state.ui.tgTesting = true;
    render();
    const res = await tgSendMessage(
      "✅ <b>Тестовое сообщение от вашей Аптеки!</b>\n\n" +
      "Связь компьютера аптеки с вашим телефоном успешно установлена! 🎉\n" +
      "Теперь сюда будут приходить уведомления о продажах и кнопки для одобрения цен."
    );
    state.ui.tgTesting = false;
    if (res && res.ok) {
      state.ui.toastSuccess = "Сообщение успешно отправлено в ваш Telegram!";
    } else {
      const reason = (res && res.description) ? res.description : "неизвестная ошибка";
      if (reason.startsWith("network_error")) {
        state.ui.scanError = "Не удалось связаться с Telegram (нет сети или блокировка запроса). Откройте приложение через https:// (не просто двойным кликом по файлу) и проверьте интернет.";
      } else {
        state.ui.scanError = "Telegram: " + reason;
      }
    }
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; state.ui.scanError = ""; render(); }, 6000);
  },

  // Role Gate & Login
  openSellerLogin() {
    state.ui.showSellerLogin = true;
    state.ui.sellerPinInput = "";
    state.ui.sellerLoginError = "";
    if (state.sellers.length > 0 && !state.ui.selectedSellerId) {
      state.ui.selectedSellerId = state.sellers[0].id;
    }
    render();
  },
  closeSellerLogin() { state.ui.showSellerLogin = false; render(); },
  selectSellerLogin(id) { state.ui.selectedSellerId = id; render(); },
  setSellerPinInput(v) { state.ui.sellerPinInput = v; },
  async submitSellerLogin() {
    const s = state.sellers.find(x => x.id === state.ui.selectedSellerId);
    if (!s) {
      state.ui.sellerLoginError = "Выберите продавца из списка";
      render(); return;
    }
    const lk = "seller_" + s.id;
    if (lockLeft(lk)) { state.ui.sellerLoginError = lockMsg(lk); render(); return; }
    const pinIn = (state.ui.sellerPinInput || "").trim();
    if (!(await checkSecret(pinIn, s.pin))) {
      lockFail(lk);
      state.ui.sellerLoginError = lockLeft(lk) ? lockMsg(lk) : "Неверный код доступа для продавца " + s.name;
      render(); return;
    }
    lockReset(lk);
    if (!isHashed(s.pin)) { s.pin = await hashSecret(pinIn); }
    state.ui.currentSeller = { id: s.id, name: s.name, storeId: s.storeId };
    state.ui.adminLoggedIn = false;
    state.ui.roleChosen = true;
    state.ui.showSellerLogin = false;
    state.ui.view = "list";

    state.sessions.push({
      id: uid(),
      sellerId: s.id,
      sellerName: s.name,
      timestamp: Date.now()
    });
    persist();

    // Telegram notification about seller login
    tgSendMessage(`🚪 <b>Вход на смену:</b> продавец <b>«${escapeHtml(s.name)}»</b> вошел в кассу.`);

    state.ui.toastSuccess = "Здравствуйте, " + s.name + "!";
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3000);
  },

  chooseRoleAdmin() {
    state.ui.showAdminLogin = true;
    state.ui.adminPasswordInput = "";
    state.ui.adminLoginError = "";
    render();
  },
  closeAdminLogin() { state.ui.showAdminLogin = false; render(); },
  setAdminPasswordInput(v) { state.ui.adminPasswordInput = v; },
  async submitAdminLogin() {
    const pw = (state.ui.adminPasswordInput || "").trim();
    const correctPw = state.settings.adminPassword || "admin";
    if (lockLeft("admin")) { state.ui.adminLoginError = lockMsg("admin"); render(); return; }
    if (await checkSecret(pw, correctPw)) {
      lockReset("admin");
      const weak = !isHashed(correctPw) && (pw === "admin" || (state.settings.masterPassword || "master2024") === "master2024");
      if (!isHashed(correctPw)) { state.settings.adminPassword = await hashSecret(pw); persist(); }
      state.ui.adminLoggedIn = true;
      state.ui.currentSeller = null;
      state.ui.roleChosen = true;
      state.ui.showAdminLogin = false;
      state.ui.view = "list";
      state.ui.toastSuccess = weak ? "⚠️ Смените пароль и мастер-пароль по умолчанию в настройках!" : "Вход администратора выполнен";
      render();
      setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3000);
    } else {
      lockFail("admin");
      state.ui.adminLoginError = lockLeft("admin") ? lockMsg("admin") : "Неверный пароль администратора";
      render();
    }
  },

  // Admin password reset via master password
  openAdminReset() {
    state.ui.showAdminLogin = false;
    state.ui.showAdminReset = true;
    state.ui.resetMasterInput = "";
    state.ui.resetNewPassword = "";
    state.ui.resetError = "";
    render();
  },
  closeAdminReset() {
    state.ui.showAdminReset = false;
    state.ui.showAdminLogin = true;
    render();
  },
  setResetMasterInput(v) { state.ui.resetMasterInput = v; },
  setResetNewPassword(v) { state.ui.resetNewPassword = v; },
  async submitAdminReset() {
    const master = (state.ui.resetMasterInput || "").trim();
    const newPw = (state.ui.resetNewPassword || "").trim();
    const correctMaster = state.settings.masterPassword || "master2024";

    if (lockLeft("master")) { state.ui.resetError = lockMsg("master"); render(); return; }
    if (!(await checkSecret(master, correctMaster))) {
      lockFail("master");
      state.ui.resetError = lockLeft("master") ? lockMsg("master") : "Неверный мастер-пароль";
      render();
      return;
    }
    lockReset("master");
    if (newPw.length < 6) { state.ui.resetError = "Пароль должен быть не короче 6 символов"; render(); return; }
    if (!newPw) {
      state.ui.resetError = "Введите новый пароль администратора";
      render();
      return;
    }

    state.settings.adminPassword = await hashSecret(newPw);
    persist();

    if (state.settings.telegramNotifySales || state.settings.telegramNotifyNewMeds) {
      tgSendMessage(
        `🔐 <b>Пароль администратора сброшен!</b>\n` +
        `Пароль был изменён через мастер-пароль ${fmtDate(Date.now())}.\n` +
        `<i>Если это были не вы — срочно смените мастер-пароль и пароль администратора в настройках.</i>`
      );
    }

    state.ui.showAdminReset = false;
    state.ui.showAdminLogin = true;
    state.ui.adminPasswordInput = "";
    state.ui.adminLoginError = "";
    state.ui.toastSuccess = "Пароль администратора сброшен! Войдите с новым паролем";
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 4000);
  },

  setRevField(k, v) { state.ui[k] = v; },
  setRevMode(m) { Object.assign(state.ui, { revMode: m, revInput: "", revInput2: "", revMaster: "", revError: "" }); render(); },
  lockRevenue() { state.ui.revUnlocked = false; state.ui.revMode = ""; render(); },
  async unlockRevenue() {
    if (lockLeft("rev")) { state.ui.revError = lockMsg("rev"); render(); return; }
    if (await checkSecret(state.ui.revInput, state.settings.revenuePassword)) {
      lockReset("rev"); _lastAct = Date.now();
      Object.assign(state.ui, { revUnlocked: true, revInput: "", revError: "" });
    } else {
      lockFail("rev");
      state.ui.revError = lockLeft("rev") ? lockMsg("rev") : "Неверный пароль дохода";
    }
    render();
  },
  async _saveRevenuePassword() {
    const a = (state.ui.revInput || "").trim(), b = (state.ui.revInput2 || "").trim();
    if (a.length < 6) { state.ui.revError = "Пароль должен быть не короче 6 символов"; render(); return; }
    if (a !== b) { state.ui.revError = "Пароли не совпадают"; render(); return; }
    if (await checkSecret(a, state.settings.adminPassword || "admin") || await checkSecret(a, state.settings.masterPassword || "master2024")) {
      state.ui.revError = "Пароль дохода должен отличаться от пароля администратора и мастер-пароля"; render(); return; }
    state.settings.revenuePassword = await hashSecret(a);
    persist(); _lastAct = Date.now();
    Object.assign(state.ui, { revUnlocked: true, revMode: "", revInput: "", revInput2: "", revMaster: "", revError: "" });
    render();
  },
  async createRevenuePassword() { if (!state.settings.revenuePassword) await this._saveRevenuePassword(); },
  async resetRevenuePassword() {
    if (lockLeft("master")) { state.ui.revError = lockMsg("master"); render(); return; }
    if (!(await checkSecret((state.ui.revMaster || "").trim(), state.settings.masterPassword || "master2024"))) {
      lockFail("master"); state.ui.revError = lockLeft("master") ? lockMsg("master") : "Неверный мастер-пароль"; render(); return; }
    lockReset("master"); await this._saveRevenuePassword();
  },
  logout() {
    state.ui.cart = []; state.ui.showCart = false; state.ui.receipt = null;
    state.ui.revUnlocked = false;
    state.ui.roleChosen = false;
    state.ui.currentSeller = null;
    state.ui.adminLoggedIn = false;
    state.ui.view = "list";
    render();
  },

  // Admin Navigation
  openAdminPanel() { if (!isAdmin()) return; state.ui.view = "admin"; render(); },
  exitAdmin() { state.ui.revUnlocked = false; state.ui.view = "list"; render(); },
  setAdminTab(t) { state.ui.adminTab = t; render(); },
  scrollAdminTabs(direction) {
    const tabs = document.getElementById("adminTabs");
    if (tabs) tabs.scrollBy({ left: direction * 260, behavior: "smooth" });
  },
  setAdminPeriod(p) { state.ui.adminPeriod = p; render(); },
  setAdminSellerFilter(f) { state.ui.adminSellerFilter = f; render(); },
  setAdminStoreFilter(f) { state.ui.adminStoreFilter = f; state.ui.adminSellerFilter = "all"; render(); },
  setCurrentStore(id) { state.ui.currentStoreId = id; state.ui.cart = []; render(); },
  openCalc() { state.ui.showCalc = true; render(); },
  closeCalc() { state.ui.showCalc = false; render(); },
  setCalcMode(m) { state.ui.calc.mode = m; render(); },
  calcKey(k) {
    const c = state.ui.calc;
    const ops = "+−×÷";
    if (k === "C") c.expr = "";
    else if (k === "⌫") c.expr = c.expr.slice(0, -1);
    else if (k === "=") { const r = calcPreview(c.expr); if (r) c.expr = r; }
    else if (ops.includes(k)) {
      if (!c.expr) { if (k === "−") c.expr = "−"; }
      else if (ops.includes(c.expr.slice(-1))) c.expr = c.expr.slice(0, -1) + k;
      else c.expr += k;
    }
    else if (k === ",") { const last = c.expr.split(/[+−×÷()]/).pop(); if (!last.includes(",")) c.expr += last ? "," : "0,"; }
    else c.expr += k;
    if (c.expr.length > 60) c.expr = c.expr.slice(0, 60);
    render();
  },
  calcToChange() { const r = calcPreview(state.ui.calc.expr); if (r) state.ui.calc.total = r; state.ui.calc.mode = "change"; render(); },
  calcField(k, v) {
    state.ui.calc[k] = v;
    const out = document.getElementById("calcOut");
    if (out) { out.innerHTML = state.ui.calc.mode === "markup" ? mkOutHtml() : chgOutHtml(); applyLang(); }
  },
  calcQuick(v) { state.ui.calc.given = String(v); render(); },
  setTab(t) { state.ui.tab = t; window.scrollTo(0, 0); render(); },
  toggleLang() { state.settings.lang = state.settings.lang === "tg" ? "ru" : "tg"; persist(); render(); },

  // Suppliers / purchases / payments
  openSupplierForm(id) {
    const s = id ? state.suppliers.find(x => x.id === id) : null;
    const c = (s && s.cards) || {};
    state.ui.sup = { type: "supplier", id: id || null, name: s ? s.name : "", phone: s ? (s.phone || "") : "", alif: c.alif || "", dc: c.dc || "", eskhata: c.eskhata || "", error: "" };
    render();
  },
  openPay(supplierId) { state.ui.sup = { type: "pay", supplierId, amount: "", method: "cash", error: "" }; render(); },
  openBuyFrom(supplierId) {
    state.ui.sup = { type: "buy", medId: "", supplierId, newName: "", qty: "", cost: "", paid: "", method: "cash", expiry: "", error: "" };
    render();
  },
  setSupMethod(m) { state.ui.sup.method = m; render(); },
  setSupMed(id) {
    const s = state.ui.sup; s.medId = id;
    const lp = id ? lastPurchaseOf(id) : null;
    if (lp && !s.cost) s.cost = String(lp.unitCost);
    render();
  },
  copyText(t) {
    const done = () => { state.ui.toastSuccess = "Скопировано!"; render(); setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, done);
    else { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove(); done(); }
  },
  openBuy(medId) {
    const lp = lastPurchaseOf(medId);
    state.ui.sup = {
      type: "buy", medId,
      supplierId: lp && state.suppliers.find(x => x.id === lp.supplierId) ? lp.supplierId : (state.suppliers[0] ? state.suppliers[0].id : "new"),
      newName: "", qty: "", cost: lp ? String(lp.unitCost) : "", paid: "", method: "cash", expiry: "", error: ""
    };
    render();
  },
  closeSup() { state.ui.sup = null; render(); },
  setSup(k, v) { state.ui.sup[k] = v; },
  setSupSelect(v) { state.ui.sup.supplierId = v; render(); },
  saveSup() {
    const s = state.ui.sup;
    const fail = msg => { s.error = msg; render(); };
    const num = v => parseFloat(String(v || "").replace(",", "."));
    const who = state.ui.currentSeller ? state.ui.currentSeller.name : "Администратор";
    if (s.type === "supplier") {
      const name = (s.name || "").trim();
      if (!name) return fail("Введите название фирмы");
      const cards = { alif: (s.alif || "").trim(), dc: (s.dc || "").trim(), eskhata: (s.eskhata || "").trim() };
      if (s.id) { const x = state.suppliers.find(y => y.id === s.id); if (x) { x.name = name; x.phone = (s.phone || "").trim(); x.cards = cards; } }
      else state.suppliers.push({ id: uid(), name, phone: (s.phone || "").trim(), cards, createdAt: Date.now() });
    } else if (s.type === "pay") {
      const amount = num(s.amount);
      if (!(amount > 0)) return fail("Укажите сумму оплаты");
      state.payments.push({ id: uid(), supplierId: s.supplierId, amount, method: s.method || "cash", by: who, timestamp: Date.now() });
      state.ui.toastSuccess = "Оплата записана!";
    } else {
      const m = state.meds.find(x => x.id === s.medId);
      if (!m) return fail("Выберите лекарство");
      let supplierId = s.supplierId;
      if (supplierId === "new") {
        const nm = (s.newName || "").trim();
        if (!nm) return fail("Введите название фирмы");
        supplierId = uid();
        state.suppliers.push({ id: supplierId, name: nm, phone: "", createdAt: Date.now() });
      }
      const qty = parseInt(s.qty, 10), cost = num(s.cost), paid = num(s.paid) || 0;
      if (!(qty > 0)) return fail("Укажите количество");
      if (!(cost >= 0) || isNaN(cost)) return fail("Укажите цену закупки");
      const sid = activeStoreId();
      addStockOf(m, sid, qty);
      if (s.expiry) m.expiry = s.expiry;
      const total = qty * cost;
      state.purchases.push({ id: uid(), supplierId, medId: m.id, medName: m.name, qty, unit: m.unit, unitCost: cost, total, storeId: sid, by: who, timestamp: Date.now() });
      if (paid > 0) state.payments.push({ id: uid(), supplierId, amount: Math.min(paid, total), method: s.method || "cash", by: who, note: "при закупке", timestamp: Date.now() });
      state.logs.push({ id: uid(), type: "restock", medicineName: m.name, qty, unit: m.unit, price: m.price, by: who, storeId: sid, timestamp: Date.now() });
      state.ui.toastSuccess = "Закупка записана. Остаток пополнен!";
    }
    persist();
    state.ui.sup = null;
    render();
    if (state.ui.toastSuccess) setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3000);
  },
  deleteSupplier(id) {
    if (state.purchases.some(p => p.supplierId === id)) { alert("Нельзя удалить фирму с историей закупок"); return; }
    if (!confirm("Удалить фирму «" + supplierName(id) + "»?")) return;
    state.suppliers = state.suppliers.filter(x => x.id !== id);
    persist(); render();
  },

  // Seller CRUD
  openAddSellerModal() {
    state.ui.editingSellerId = null;
    state.ui.sellerFormName = "";
    state.ui.sellerFormPin = "";
    state.ui.sellerFormStoreId = (state.ui.adminStoreFilter !== "all" ? state.ui.adminStoreFilter : (state.stores[0] && state.stores[0].id));

  },
  openEditSellerModal(id) {
    const s = state.sellers.find(x => x.id === id);
