  // Cart: many medicines in one receipt
  addToCart(id) {
    const m = state.meds.find(x => x.id === id);
    if (!m) return;
    const avail = stockOf(m, activeStoreId());
    const c = state.ui.cart.find(x => x.medId === id);
    if (c) { if (c.qty < avail) c.qty += 1; }
    else if (avail > 0) state.ui.cart.push({ medId: id, qty: 1 });
    render();
  },
  openCart() { state.ui.formError = ""; state.ui.showCart = true; render(); },
  closeCart() { state.ui.showCart = false; state.ui.formError = ""; render(); },
  cartStep(id, d) { const c = state.ui.cart.find(x => x.medId === id); if (c) app.cartSet(id, c.qty + d); },
  cartSet(id, v) {
    const c = state.ui.cart.find(x => x.medId === id);
    const m = state.meds.find(x => x.id === id);
    if (!c || !m) return;
    let q = parseInt(v, 10);
    if (isNaN(q) || q < 1) q = 1;
    const avail = stockOf(m, activeStoreId());
    state.ui.formError = q > avail ? "На складе осталось всего " + avail + " " + m.unit : "";
    c.qty = Math.min(q, Math.max(avail, 1));
    render();
  },
  cartRemove(id) { state.ui.cart = state.ui.cart.filter(x => x.medId !== id); state.ui.formError = ""; if (!state.ui.cart.length) state.ui.showCart = false; render(); },
  cartClear() { state.ui.cart = []; state.ui.showCart = false; state.ui.formError = ""; render(); },
  closeReceipt() { state.ui.receipt = null; render(); },
  confirmCart() {
    const lines = cartLines();
    if (!lines.length) return;
    const sid = activeStoreId();
    for (const l of lines) {
      if (l.qty > l.avail) { state.ui.formError = l.m.name + ": на складе осталось всего " + l.avail + " " + l.m.unit; render(); return; }
    }
    const currentSeller = state.ui.currentSeller;
    const sellerId = currentSeller ? currentSeller.id : "admin";
    const sellerName = currentSeller ? currentSeller.name : "Администратор";
    const receiptId = uid(), ts = Date.now();
    let total = 0;
    const items = lines.map(l => {
      addStockOf(l.m, sid, -l.qty);
      const sum = l.price * l.qty;
      total += sum;
      state.sales.push({ id: uid(), receiptId, medicineId: l.m.id, name: l.m.name, price: l.price, qty: l.qty, total: sum, sellerId, sellerName, storeId: sid, timestamp: ts });
      return { name: l.m.name, unit: l.m.unit, qty: l.qty, price: l.price, sum };
    });
    persist();
    state.ui.receipt = { id: receiptId, items, total, sellerName, timestamp: ts, storeName: state.stores.length > 1 ? storeName(sid) : "" };
    state.ui.cart = [];
    state.ui.showCart = false;
    state.ui.formError = "";

    if (state.settings.telegramNotifySales) {
      tgSendMessage(
        `💰 <b>Новая продажа на кассе!</b>\n\n` +
        items.map(it => `💊 ${escapeHtml(it.name)} — ${it.qty} ${escapeHtml(it.unit)} × ${fmtPrice(it.price)} = ${fmtPrice(it.sum)}`).join("\n") +
        `\n\n💵 <b>Итого по чеку:</b> ${fmtPrice(total)}\n` +
        `👤 <b>Продавец:</b> ${escapeHtml(sellerName)}` +
        (state.stores.length>1 ? `\n🏪 <b>Аптека:</b> ${escapeHtml(storeName(sid))}` : "")
      );
    }
    render();
  },
  confirmFastSell() {
    const id = state.ui.sellingMedId;
    const m = state.meds.find(x => x.id === id);
    if (!m) return;
    const sid = activeStoreId();
    const qty = parseInt(state.ui.sellQty, 10);
    const available = stockOf(m, sid);
    if (isNaN(qty) || qty <= 0) { state.ui.formError = "Укажите количество для продажи"; render(); return; }
    if (qty > available) { state.ui.formError = "На складе осталось всего " + available + " " + m.unit; render(); return; }

    addStockOf(m, sid, -qty);
    const currentSeller = state.ui.currentSeller;
    const sellerId = currentSeller ? currentSeller.id : "admin";
    const sellerName = currentSeller ? currentSeller.name : "Администратор";

    const total = m.price * qty;
    state.sales.push({
      id: uid(),
      medicineId: m.id,
      name: m.name,
      price: m.price,
      qty,
      total: total,
      sellerId,
      sellerName,
      storeId: sid,
      timestamp: Date.now()
    });

    persist();
    state.ui.showSellSheet = false;
    state.ui.toastSuccess = "Продано: " + qty + " " + m.unit + " (" + fmtPrice(total) + ") · " + sellerName;

    // Telegram notification
    if (state.settings.telegramNotifySales) {
      tgSendMessage(
        `💰 <b>Новая продажа на кассе!</b>\n\n` +
        `💊 <b>Товар:</b> ${escapeHtml(m.name)}\n` +
        `📦 <b>Количество:</b> ${qty} ${escapeHtml(m.unit)}\n` +
        `💵 <b>Сумма:</b> ${fmtPrice(total)}\n` +
        `👤 <b>Продавец:</b> ${escapeHtml(sellerName)}\n` +
        (state.stores.length>1 ? `🏪 <b>Аптека:</b> ${escapeHtml(storeName(sid))}\n` : "") +
        `📊 <b>Осталось на складе:</b> ${stockOf(m, sid)} ${escapeHtml(m.unit)}`
      );
    }

    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3500);
  },

  submitForm() {
    const f = state.ui.form;
    const name = f.name.trim();
    const manufacturer = (f.manufacturer || "").trim();
    const country = (f.country || "").trim();
    const price = parseFloat(String(f.price).replace(",", "."));
    const qty = parseInt(f.qty, 10);
    const category = state.ui.newCategoryMode ? state.ui.newCategoryName.trim() : f.category;

    if (!name) { state.ui.formError = "Введите название лекарства"; render(); return; }
    if (isNaN(price) || price < 0) { state.ui.formError = "Введите корректную цену"; render(); return; }
    if (isNaN(qty) || qty < 0) { state.ui.formError = "Введите количество"; render(); return; }
    if (!category) { state.ui.formError = "Выберите категорию"; render(); return; }

    if (state.ui.newCategoryMode && !state.settings.customCategories.includes(category)) {
      state.settings.customCategories.push(category);
    }
    const admin = isAdmin();
    const currentUserName = getCurrentUserName();

    if (state.ui.editingId) {
      const m = state.meds.find(x => x.id === state.ui.editingId);
      const sid = activeStoreId();
      const oldQty = stockOf(m, sid);
      const oldPrice = m.price;
      const priceChanged = price !== oldPrice;
      const needsApproval = priceChanged && !admin;

      Object.assign(m, {
        name,
        manufacturer,
        country,
        // Если цену меняет продавец — старая цена остаётся, пока админ не одобрит
        price: needsApproval ? oldPrice : price,
        unit: f.unit,
        category,
        expiry: (f.expiry||"").trim(),
        photo: f.photo || null
      });
      setStockOf(m, sid, qty);

      if (qty > oldQty) {
        state.logs.push({
          id: uid(),
          type: 'restock',
          medicineName: m.name,
          qty: qty - oldQty,
          unit: m.unit,
          price: m.price,
          by: currentUserName,
          storeId: sid,
          timestamp: Date.now()
        });
      }

      if (needsApproval) {
        // Создаём заявку на подтверждение новой цены
        const reqId = uid();
        state.priceRequests = state.priceRequests.filter(r => r.medicineId !== m.id); // одна активная заявка на товар
        state.priceRequests.push({
          id: reqId,
          medicineId: m.id,
          name: m.name,
          oldPrice,
          newPrice: price,
          requestedBy: currentUserName,
          timestamp: Date.now()
        });

        if (state.settings.telegramNotifyNewMeds) {
          const text = `🔔 <b>Запрос на изменение цены!</b>\n\n` +
            `💊 <b>Товар:</b> ${escapeHtml(m.name)}\n` +
            `💰 <b>Старая цена:</b> ${fmtPrice(oldPrice)}\n` +
            `💰 <b>Новая цена:</b> ${fmtPrice(price)}\n` +
            `👤 <b>Запросил:</b> ${escapeHtml(currentUserName)}\n\n` +
            `<i>Подтвердить новую цену?</i>`;
          const keyboard = [
            [
              { text: "✅ Одобрить цену", callback_data: `appr_pr_${reqId}` },
              { text: "❌ Отклонить", callback_data: `rej_pr_${reqId}` }
            ]
          ];
          tgSendMessage(text, keyboard);
        }

        state.ui.toastSuccess = "Товар обновлен! Изменение цены отправлено на подтверждение администратору";
      } else {
        state.ui.toastSuccess = "Товар обновлен!";
      }
    } else {
      const sid = activeStoreId();
      const newMed = {
        id: uid(),
        name,
        manufacturer,
        country,
        price,
        stock: { [sid]: qty },
        unit: f.unit,
        category,
        photo: f.photo || null,
        expiry: (f.expiry||"").trim(),
        addedBy: currentUserName,
        addedStoreId: sid,
        addedAt: Date.now()
      };
      if (!admin) newMed.priceUnconfirmed = true;
      state.meds.unshift(newMed);

      state.logs.push({
        id: uid(),
        type: 'add_med',
        medicineName: name,
        qty,
        unit: f.unit,
        price,
        by: currentUserName,
        storeId: sid,
        timestamp: Date.now()
      });

      // Send to Telegram with APPROVE / REJECT buttons for admin's phone!
      if (state.settings.telegramNotifyNewMeds) {
        const text = `🔔 <b>Новое лекарство от сотрудника!</b>\n\n` +
          `💊 <b>Название:</b> ${escapeHtml(name)}\n` +
          (manufacturer ? `🏭 <b>Производитель:</b> ${escapeHtml(manufacturer)}\n` : "") +
          (country ? `🌍 <b>Страна:</b> ${escapeHtml(country)}\n` : "") +
          `💰 <b>Цена:</b> ${fmtPrice(price)}\n` +
          `📦 <b>Остаток:</b> ${qty} ${escapeHtml(f.unit)}\n` +
          (state.stores.length>1 ? `🏪 <b>Аптека:</b> ${escapeHtml(storeName(sid))}\n` : "") +
          `👤 <b>Добавил:</b> ${escapeHtml(currentUserName)}\n\n` +
          `<i>Подтвердить цену и разрешить продажу?</i>`;

        const keyboard = [
          [
            { text: "✅ Одобрить цену", callback_data: `appr_med_${newMed.id}` },
            { text: "❌ Отклонить", callback_data: `rej_med_${newMed.id}` }
          ]
        ];
        tgSendMessage(text, keyboard);
      }

      state.ui.toastSuccess = !admin ? "Лекарство добавлено! Запрос отправлен в Telegram администратора" : "Новое лекарство добавлено на склад!";
    }

    persist();
    state.ui.showForm = false;
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3500);
  },

  async changeAdminPassword() {

    const newVal = (state.ui.pwNew || "").trim();
    if (!newVal) { state.ui.pwError = "Введите новый пароль"; render(); return; }
    if (newVal.length < 6 || newVal === "admin") { state.ui.pwError = "Пароль должен быть не короче 6 символов и не «admin»"; render(); return; }
    if (!(await checkSecret(state.ui.pwCurrent, current))) {
      state.ui.pwError = "Текущий пароль указан неверно"; render(); return; }
    state.settings.adminPassword = await hashSecret(newVal);
    state.ui.pwCurrent = ""; state.ui.pwNew = ""; state.ui.pwError = "";
    persist();
    state.ui.toastSuccess = "Пароль администратора обновлен";
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3000);
  },
  setMasterPwCurrent(v) { state.ui.masterPwCurrent = v; },
  setMasterPwNew(v) { state.ui.masterPwNew = v; },
  async changeMasterPassword() {
    const current = state.settings.masterPassword || "master2024";
    const newVal = (state.ui.masterPwNew || "").trim();
    if (!newVal) { state.ui.masterPwError = "Введите новый мастер-пароль"; render(); return; }
    if (newVal.length < 8 || newVal === "master2024") { state.ui.masterPwError = "Мастер-пароль: не короче 8 символов и не «master2024»"; render(); return; }
    if (!(await checkSecret(state.ui.masterPwCurrent, current))) {
      state.ui.masterPwError = "Текущий мастер-пароль указан неверно"; render(); return; }
    state.settings.masterPassword = await hashSecret(newVal);
    state.ui.masterPwCurrent = ""; state.ui.masterPwNew = ""; state.ui.masterPwError = "";
    persist();
    state.ui.toastSuccess = "Мастер-пароль обновлен";
    render();
    setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 3000);
  },

  // Backup & Restore
  exportData() {
    const data = {
      meds: state.meds,
      sales: state.sales,
      settings: Object.fromEntries(Object.entries(state.settings).filter(([k]) => !["adminPassword", "masterPassword", "apiKey", "telegramBotToken", "telegramChatId", "revenuePassword"].includes(k))),
      priceRequests: state.priceRequests,
      sellers: state.sellers,
      sessions: state.sessions,
      logs: state.logs,
      stores: state.stores,
      suppliers: state.suppliers,
      purchases: state.purchases,
      payments: state.payments,
      exportedAt: Date.now()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "аптека_база_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  },
  pickRestoreFile() { document.getElementById("restoreFileInput").click(); },
  clearToast() { state.ui.scanError = ""; state.ui.toastSuccess = ""; render(); },

  startScan() {
    if (state.ui.scanning) return;
    if (!(state.settings.apiKey || "").trim()) {
      state.ui.scanError = "Сначала добавьте API-ключ в Настройках (⚙️), чтобы сканер мог распознавать лекарства.";
      render();
      setTimeout(() => { state.ui.scanError = ""; render(); }, 6000);
      return;
    }
    state.ui.photoMode = "scan";
    document.getElementById("medPhotoInput").click();
  }
};

// Image resize utility
function resizeImage(file, maxSize = 600, quality = 0.85) {
  const draw = (src, w, h0) => {
    let width = w, height = h0;
    if (width > height && width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
    else if (height >= width && height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(src, 0, 0, width, height);
    return canvas.toDataURL("image/jpeg", quality);
  };
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { try { resolve(draw(img, img.naturalWidth || img.width, img.naturalHeight || img.height)); } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); } };
    img.onerror = async () => {
      URL.revokeObjectURL(url);
      try { const bmp = await createImageBitmap(file); resolve(draw(bmp, bmp.width, bmp.height)); }
      catch (e) { reject(new Error("image load failed")); }
    };
    img.src = url;
  });
}

document.getElementById("medPhotoInput").addEventListener("change", async (e) => {
  const rawFile = e.target.files && e.target.files[0];
  const mode = state.ui.photoMode || "attach";
  state.ui.photoMode = "attach"; // reset for next time
  if (!rawFile) return;
  // Copy the file into memory BEFORE clearing the input: on many Android browsers
  // clearing input.value invalidates the picked file, so the photo silently fails.
  let file;
  try { const buf = await rawFile.arrayBuffer(); file = new File([buf], rawFile.name || "photo.jpg", { type: rawFile.type || "image/jpeg" }); }
  catch (err) { file = rawFile; }
  e.target.value = "";

  if (mode !== "scan") {
    // Plain "attach photo" flow inside an already-open form — unchanged behavior.
    try {
      const dataUrl = await resizeImage(file);
      state.ui.form.photo = dataUrl;
      render();
    } catch (err) {
      state.ui.formError = "Не удалось загрузить фото";
      render();
    }
    return;
  }

  // "Scan" flow — recognize name / manufacturer / country, then open the add form pre-filled.
  state.ui.scanning = true;
  state.ui.scanError = "";
  render();

  let dataUrl;
  try {
    dataUrl = await resizeImage(file, 900, 0.9); // slightly higher quality for better OCR
  } catch (err) {
    state.ui.scanning = false;
    state.ui.scanError = "Не удалось обработать фото. Попробуйте ещё раз.";
    render();
    setTimeout(() => { state.ui.scanError = ""; render(); }, 6000);
    return;
  }

  const result = await recognizeMedicineFromPhoto(dataUrl);
  state.ui.scanning = false;

  // Open the add-medicine form either way, so the photo isn't lost even if recognition failed.
  state.ui.editingId = null;
  state.ui.form = {
    name: (result.ok && result.name) ? result.name : "",
    manufacturer: (result.ok && result.manufacturer) ? result.manufacturer : "",
    country: (result.ok && result.country) ? result.country : "",
    price: "",
    qty: "",
    unit: "уп.",
    category: DEFAULT_CATEGORIES[0],
    photo: dataUrl
  };
  state.ui.formError = "";
  state.ui.newCategoryMode = false;
  state.ui.newCategoryName = "";
  state.ui.showForm = true;

  if (result.ok) {
    if (result.name || result.manufacturer || result.country) {
      state.ui.toastSuccess = "Готово! Проверьте распознанные данные и укажите цену.";
      setTimeout(() => { state.ui.toastSuccess = ""; render(); }, 4000);
    } else {
      state.ui.scanError = "Не удалось разобрать надписи на фото. Заполните поля вручную.";
      setTimeout(() => { state.ui.scanError = ""; render(); }, 6000);
    }
  } else {
    const messages = {
      no_key: "Не указан API-ключ. Добавьте его в Настройках (⚙️).",
      bad_image: "Не удалось обработать фото.",
      api_error: "Ошибка сервиса распознавания: " + (result.message || ""),
      empty_response: "Сервис не вернул ответ. Попробуйте ещё раз.",
      parse_error: "Не удалось разобрать ответ сервиса. Попробуйте ещё раз.",
      network_error: "Нет соединения с интернетом или сервис недоступен."
    };
    state.ui.scanError = (messages[result.error] || "Не удалось распознать лекарство.") + " Данные можно ввести вручную.";
    setTimeout(() => { state.ui.scanError = ""; render(); }, 7000);
  }

  render();
});

document.getElementById("restoreFileInput").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("неверный формат файла");
      // ids end up in inline handlers, so accept only safe ones; lists must be arrays
      const list = a => Array.isArray(a) ? a.filter(x => x && typeof x === "object" && (x.id === undefined || SAFE_ID.test(String(x.id)))) : null;
      ["meds","sales","priceRequests","sessions","logs","stores","suppliers","purchases","payments"].forEach(k => { const v = list(data[k]); if (v) state[k] = v; });
      const sl = list(data.sellers);
      if (sl) state.sellers = sl.map(s => Object.assign({}, s, { pin: isHashed(s.pin) ? s.pin : "!" })); // plaintext PINs from a backup are not trusted: admin must reset them
      if (data.settings && typeof data.settings === "object") {
        ["threshold","currency","sortLowFirst","customCategories","telegramNotifySales","telegramNotifyNewMeds"].forEach(k => { if (k in data.settings) state.settings[k] = data.settings[k]; });
      }
      if (state.stores.length && !state.stores.find(s => s.id === state.ui.currentStoreId)) {
        state.ui.currentStoreId = state.stores[0].id;
      }
      persist();
      state.ui.toastSuccess = "База данных успешно восстановлена!";
      render();
    } catch(err) {
      alert("Ошибка при чтении файла резервной копии: " + err.message);
    }
  };
  reader.readAsText(file);
});

// Initial render
render();
</script>
